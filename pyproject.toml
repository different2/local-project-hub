[tool.briefcase]
project_name = "local-project-hub"
# DO NOT change `bundle` or the app key (`hub`, set in [tool.briefcase.app.hub])
# without understanding this: the Windows MSI's UpgradeCode is derived
# deterministically from the bundle identifier, and that GUID is what lets a
# new MSI replace an older install. Change it and Windows updates stop
# upgrading — each release installs alongside the last instead of over it,
# with no error to explain why. The same applies to renaming the app key.
bundle = "local.projecthub"
version = "0.7.1"
url = "https://github.com/different2/local-project-hub"
license = "MIT"
license-files = ["LICENSE"]
author = "Local Project Hub contributors"
author_email = "9109630+different2@users.noreply.github.com"

# macOS: the app icon and the runtime it ships with. QtWebEngine is required
# (the dashboard panes are real embedded browsers), so PySide6-Addons must be
# in the requires list or the packaged app cannot import QWebEngineView.
# Briefcase appends the extension itself, so the value must NOT include it.
icon = "assets/icon"

# Pin a coherent Qt pair per platform, coordinated with CI/build jobs.
# macOS retains its existing Qt/support floor. Windows uses 6.12.0 because
# default-sandbox controls on Windows 2025 fail with 6.7.3 and pass with 6.12.0.
# Do not upgrade macOS as a side effect of a Windows compatibility correction.
requires = [
    "PySide6-Essentials==6.7.3; sys_platform != 'win32'",
    "PySide6-Addons==6.7.3; sys_platform != 'win32'",
    "PySide6-Essentials==6.12.0; sys_platform == 'win32'",
    "PySide6-Addons==6.12.0; sys_platform == 'win32'",
    # The app's own HTTPS (update check + download) verifies against a CA
    # bundle that always exists. The bundle's Python has NO default trust
    # store — its compiled-in paths point at the python.org framework
    # location, which is not inside the app — so before this every HTTPS
    # request died CERTIFICATE_VERIFY_FAILED and the update check said
    # "Could not reach the update server" on a healthy connection (real
    # click on 0.4.0, reproduced inside the bundle, 2026-10-18).
    "certifi==2026.10.18",
    # macOS only: the About box's traffic lights cannot be controlled through Qt
    # (every window-button hint combination yields some set of buttons, never
    # close alone), so the real AppKit buttons are hidden via pyobjc. Guarded at
    # import time — the app runs unchanged where it is absent or not macOS.
    # Pinned 12.2.2: what the shipped 0.3.8/0.4.x bundles contain — a floating
    # pin lets a rebuild silently change the AppKit behaviour the About box
    # was verified against.
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
]

# Python 3.11+ has wheels for arm64 macOS; 3.9 (the dev interpreter) does not,
# so the packaged app runs a newer Python than the source checkout.
requires_python = ">=3.11"

test_requires = ["pytest"]

[tool.briefcase.app.hub]
formal_name = "Local Project Hub"
long_description = "A control centre for locally hosted projects: register a folder, configure how it starts, and open its dashboard in one window."
description = "Launcher for local web project dashboards"
# Briefcase requires the app name to match an importable package; the code
# lives in `hub`, so the app is named `hub` and main.py is the entry point.
sources = ["hub", "main.py"]
# Briefcase defaults to running the package itself (python -m hub), which
# fails: `hub` is a package with no __main__. Point it at main.py instead.
entry_point = "main.py"

# The state directory is created at runtime in the per-user location; nothing
# in the bundle is written to, so the app works when installed to /Applications.
[tool.briefcase.app.hub.macOS]
# Briefcase 0.4.6 reads min_os_version; minimum_system_version is ignored
# and produces an Info.plist advertising the support runtime's 11.0 default.
min_os_version = "12.0"
# Build for the current host architecture (the release runner is Apple silicon).
universal_build = false

[tool.briefcase.app.hub.windows]
# Notarisation/signing are off until certificates exist; see DEVELOPMENT.md
# "Signing" for what that involves.
# The installer format matches what the in-app updater expects to hand off to.
installer_license = "LICENSE"

# Native packages are distro/Python-ABI-specific, not all-distro binaries.
# This target uses Ubuntu 24.04's system Python 3.12.
[tool.briefcase.app.hub.linux.system.ubuntu.noble]
system_requires = ["build-essential", "pkg-config", "python3-dev"]
system_runtime_requires = [
    "libatomic1", "libegl1", "libgl1", "libglib2.0-0t64", "libdbus-1-3",
    "libnss3", "libnspr4", "libasound2t64", "libdrm2", "libgbm1",
    "libxcomposite1", "libxdamage1", "libxrandr2", "libxtst6", "libxkbfile1", "libxshmfence1",
    "libxi6", "libx11-6", "libx11-xcb1", "libxext6", "libxfixes3", "libxrender1",
    "libfontconfig1", "libfreetype6", "libexpat1", "libxkbcommon0", "libxkbcommon-x11-0",
    "libxcb1", "libxcb-cursor0", "libxcb-icccm4", "libxcb-image0", "libxcb-keysyms1",
    "libxcb-randr0", "libxcb-render0", "libxcb-render-util0", "libxcb-shape0",
    "libxcb-shm0", "libxcb-sync1", "libxcb-util1", "libxcb-xfixes0", "libxcb-xkb1",
    "libgssapi-krb5-2", "libstdc++6", "libgcc-s1", "zlib1g", "libzstd1",
    "libgtk-3-0t64", "lsof", "procps", "xdg-utils",
]
