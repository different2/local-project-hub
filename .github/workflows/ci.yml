name: CI

# NB: this key must stay spelled "on" -- quoted, and never re-dumped through
# PyYAML, which follows YAML 1.1 where `on` is a boolean and rewrote it as
# `true:`. GitHub rejected the whole workflow with "Unexpected value 'true'",
# and the resulting 0-second runs were indistinguishable from runner refusal.
'on':
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linux_only:
        description: Build only Linux for packaging diagnosis (no publication)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || !inputs.linux_only
    # The cap has to cover the real work, and that is dominated by one suite:
    # test_urldetect takes ~6 minutes because 9 of its tests create a real
    # QtWebEngine window and each is isolated into its own process (running the
    # file in a single process segfaults at Qt shutdown with zero tests
    # reported -- that is what the isolation is for, so it cannot simply be
    # dropped). 15 suites together land near 30 minutes on this Mac and more on
    # a CI runner, so a 35-minute cap killed the job before any output was
    # written, twice.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # max-parallel: 1 -- the suites bind fixed ports on 127.0.0.1, so two
      # platforms could not collide even if they shared a machine (they do not:
      # each matrix job gets its own runner). Serialising is about runner
      # ALLOCATION, not isolation: parallel GUI jobs contend for the account's
      # capacity, and a platform that needs a slot can sit queued behind one
      # that is only slow. One at a time gets the scarce runner to the platform
      # that needs it.
      max-parallel: 1
      matrix:
        # Pinned to 24.04: the ubuntu-latest label moves to Ubuntu 26, which
        # this project has not been tested against.
        #
        # macOS is verified locally. Linux packages target Ubuntu 24.04 amd64;
        # these target platforms execute on their actual GitHub runners.
        os:
          - ubuntu-24.04
          # Cover both Windows hosts with the validated Qt 6.12.0 stack and
          # normal sandboxing. macOS keeps 6.7.3 and its existing OS floor.
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12' || '3.11' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Addons contains QtWebEngineWidgets/the renderer helper; the PySide6
          # metapackage resolves the matching pair. Pin the complete trio and
          # assert the real WebEngine import below, not only import PySide6.
          #
          # PyYAML is needed by tests/test_workflow_yaml.py, which guards this
          # very file. Without it that guard dies with ModuleNotFoundError on
          # every platform -- and this file is what broke silently once already,
          # so its guard has to be able to run everywhere.
          #
          # The GUI and trust-store set is pinned; it must match the app
          # bundle and the local venvs (see DEVELOPMENT.md "Dependency
          # versions"), and a test fails if the pins drift or go unpinned.
          # certifi is what the app's own HTTPS verifies against (the bundle
          # has no default CA store); pyobjc (macOS only — the marker keeps
          # the Linux and Windows runners from installing it) is the AppKit
          # piece of the About-box fix, pinned to what the shipped bundles
          # contain.
          python -m pip install "PySide6-Essentials==6.7.3; sys_platform != 'win32'" "PySide6-Addons==6.7.3; sys_platform != 'win32'" "PySide6==6.7.3; sys_platform != 'win32'" "PySide6-Essentials==6.12.0; sys_platform == 'win32'" "PySide6-Addons==6.12.0; sys_platform == 'win32'" "PySide6==6.12.0; sys_platform == 'win32'" "Pillow==11.3.0" "certifi==2026.10.18" "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'"
          python -m pip install pytest PyYAML

      # Must come BEFORE the import check below: the check needs libEGL and
      # friends, so running it first reports a missing-OS-library problem as a
      # missing-wheel problem and sends you chasing the wrong cause.
      - name: Install Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Exact Noble dependencies are shared with the .deb; missing packages
          # fail rather than hiding an incomplete installer.
          packages="$(python -c 'import tomllib; d=tomllib.load(open("pyproject.toml", "rb")); print(" ".join(d["tool"]["briefcase"]["app"]["hub"]["linux"]["system"]["ubuntu"]["noble"]["system_runtime_requires"]))')"
          sudo apt-get install -y --no-install-recommends $packages xvfb xauth dbus-daemon libgl1-mesa-dri fonts-dejavu-core

      - name: Verify QtWebEngine is importable
        shell: bash
        run: |
          # QtWebEngineWidgets ships in the Addons wheel. Assert it imports
          # so a resolution problem names itself here instead of surfacing later
          # as a bare "Run the test suite" failure with no output to read.
          python -c "import PySide6, os; d=os.path.dirname(PySide6.__file__); print('PySide6', PySide6.__version__, 'at', d)"
          python -m pip list | grep -i pyside || true
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print('QtWebEngine OK', __import__('PySide6').__version__)"

      - name: Run the test suite
        shell: bash
        run: |
          # Tee to a .log so the upload step below has something to publish even
          # when the suite fails. Without the tee a failing run uploaded an
          # empty artifact and the failure could not be read offline.
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tools/run_regression_strict.py --output "$RUNNER_TEMP/test-audit" 2>&1 | tee test-output.log
          else
            python tools/run_regression_strict.py --output "$RUNNER_TEMP/test-audit" 2>&1 | tee test-output.log
          fi
          # Preserve the suite's exit code through the pipe; tee would mask it
          # and report a red suite as green.
          exit "${PIPESTATUS[0]}"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-${{ matrix.os }}
          path: |
            **/*.log
            ${{ runner.temp }}/test-audit
          if-no-files-found: ignore
          retention-days: 7

  # All three build jobs run on a version tag OR on a manual dispatch. Dispatch
  # exists because these jobs are otherwise unreachable until a release is cut,
  # so a broken packaging change could only be discovered by spending a tag on
  # it — which is exactly how the `--msi` and `--dmg` typos survived unnoticed.
  # A dispatch run builds and uploads artifacts and NEVER publishes: `publish`
  # below stays tag-gated, so a manual click cannot cut a release.
  build-macos:
    name: Build macOS installer
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.linux_only)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check the tag matches the app version
        # Runs before the build so a forgotten version bump fails in seconds
        # instead of after ten minutes of packaging. Only on tags: a manual
        # dispatch has a branch name here, not a version.
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_tag_version.py "${{ github.ref_name }}"
      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned deliberately: briefcase produces the release artifacts, so a
          # new version arriving silently is a change to the release path we did
          # not ask for. 0.4.6 is the version v0.3.7 and v0.3.8 were built with.
          # Bump this pin as a reviewed, standalone change —
          # tests/test_workflow_yaml.py fails if it goes unpinned again.
          python -m pip install "briefcase==0.4.6"
          # The GUI set, pinned to what the suite runs and the bundle ships
          # (see DEVELOPMENT.md "Dependency versions" — 6.7.3 is the newest
          # PySide6 the app bundle can take while it targets older macOS).
          python -m pip install "PySide6==6.7.3" "PySide6-Addons==6.7.3" "PySide6-Essentials==6.7.3" "Pillow==11.3.0"
      - name: Build the .app
        run: briefcase build macOS
      - name: Verify the actual macOS deployment floor
        run: |
          python - <<'PY'
          import pathlib, plistlib
          apps = list(pathlib.Path("build").rglob("Local Project Hub.app/Contents/Info.plist"))
          assert len(apps) == 1, apps
          info = plistlib.loads(apps[0].read_bytes())
          assert info["LSMinimumSystemVersion"] == "12.0", info
          print("Actual bundle deployment floor:", info["LSMinimumSystemVersion"])
          PY
      - name: Package the .dmg
        # `-p dmg`, not `--dmg`: briefcase has no `--dmg` flag (it takes
        # -p/--packaging-format with zip|dmg|pkg).
        #
        # `--adhoc-sign` is required for CI, not cosmetic. With no identity
        # configured, briefcase PROMPTS ("Select application signing identity
        # to use:") and there is no terminal to answer, so it aborts with exit
        # 214 — the first run of this job died exactly that way. Passing the
        # flag skips the prompt and ad-hoc signs, which is what a local build
        # produces anyway when the prompt is answered with its default. The
        # result is unsigned-in-practice: Gatekeeper needs right-click → Open
        # on first launch, the same as the local .dmg.
        run: briefcase package macOS -p dmg --adhoc-sign
      - name: Collect the installer
        run: python tools/release_artifacts.py collect macos
      - uses: actions/upload-artifact@v5
        with:
          name: LocalProjectHub-macOS
          path: release-assets/Local.Project.Hub.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-2025
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.linux_only)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_tag_version.py "${{ github.ref_name }}"
      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned deliberately: briefcase produces the release artifacts, so a
          # new version arriving silently is a change to the release path we did
          # not ask for. 0.4.6 is the version v0.3.7 and v0.3.8 were built with.
          # Bump this pin as a reviewed, standalone change —
          # tests/test_workflow_yaml.py fails if it goes unpinned again.
          python -m pip install "briefcase==0.4.6"
          # Match Windows tests and the platform-marked package dependencies.
          # macOS deliberately retains 6.7.3 and its existing support floor.
          python -m pip install "PySide6==6.12.0" "PySide6-Addons==6.12.0" "PySide6-Essentials==6.12.0" "Pillow==11.3.0"
      - name: Build the MSI installer
        # `--msi` was never a valid flag — this job is tag-gated and the repo had
        # no tags until v0.3.7, so the command had never once been executed and
        # the typo went unnoticed. The flag is -p/--packaging-format, which is
        # what both the runner's Briefcase and the local .buildenv (0.4.5) accept.
        run: briefcase package windows -p msi
      - name: Collect the installer
        run: python tools/release_artifacts.py collect windows
      - uses: actions/upload-artifact@v5
        with:
          name: LocalProjectHub-Windows
          path: release-assets/Local.Project.Hub.msi
          if-no-files-found: error

  build-linux:
    name: Build Ubuntu 24.04 amd64 installer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: /usr/bin/python3 tools/check_tag_version.py "${{ github.ref_name }}"
      - name: Install native build and runtime dependencies
        run: |
          sudo apt-get update
          packages="$(/usr/bin/python3 -c 'import tomllib; d=tomllib.load(open("pyproject.toml", "rb")); print(" ".join(d["tool"]["briefcase"]["app"]["hub"]["linux"]["system"]["ubuntu"]["noble"]["system_runtime_requires"]))')"
          sudo apt-get install -y --no-install-recommends build-essential dpkg-dev pkg-config git python3-dev python3-venv $packages xvfb xauth dbus-daemon libgl1-mesa-dri fonts-dejavu-core openbox wmctrl x11-utils
      - name: Install pinned toolchain under the system Python
        # Native-system Briefcase must exactly match /usr/bin/python3, not an
        # actions/setup-python interpreter. Noble uses Python 3.12.
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/linux-buildenv"
          echo "$RUNNER_TEMP/linux-buildenv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/linux-buildenv/bin/python" -m pip install "briefcase==0.4.6" "PySide6==6.7.3" "PySide6-Essentials==6.7.3" "PySide6-Addons==6.7.3" "Pillow==11.3.0" "websocket-client==1.8.0"
      - name: Build and package the native .deb
        run: |
          briefcase build linux system --no-input
          briefcase package linux system -p deb --adhoc-sign --no-input
          python tools/release_artifacts.py collect linux
      - name: Inspect and install the actual package
        run: |
          dpkg-deb --info release-assets/*.deb
          dpkg-deb --contents release-assets/*.deb
          sudo apt-get install -y "$PWD/release-assets/Local.Project.Hub.Ubuntu-24.04-amd64.deb"
          ldd /usr/bin/hub
          test -x /usr/lib/hub/app_packages/PySide6/Qt/libexec/QtWebEngineProcess
      - name: Verify the installed app renders with sandbox enabled
        run: |
          export TMPDIR="$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/linux-smoke"
          python -c 'import json,os; from pathlib import Path; paths={"apparmor_enabled":"/sys/module/apparmor/parameters/enabled", "apparmor_restrict_userns":"/proc/sys/kernel/apparmor_restrict_unprivileged_userns", "unprivileged_userns_clone":"/proc/sys/kernel/unprivileged_userns_clone"}; data={k:Path(p).read_text().strip() if Path(p).exists() else "not_available" for k,p in paths.items()}; data["uid"]=os.getuid(); (Path(os.environ["RUNNER_TEMP"])/"linux-smoke/runner-security.json").write_text(json.dumps(data,indent=2))'
          export LPH_EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["briefcase"]["version"])')"
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- bash -euc '
            openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
            trap "openbox --exit >/dev/null 2>&1 || true" EXIT
            python tools/smoke_linux_installer.py --output "$RUNNER_TEMP/linux-smoke/positive" --expected-version "$LPH_EXPECTED_VERSION"
            set +e
            python tools/smoke_linux_installer.py --output "$RUNNER_TEMP/linux-smoke/wrong-text" --expected-version "$LPH_EXPECTED_VERSION" --expected-text deliberately-wrong
            code=$?
            set -e
            test "$code" = 1
            python -c "import json,os; from pathlib import Path; p=json.loads((Path(os.environ[\"RUNNER_TEMP\"])/\"linux-smoke/wrong-text/report.json\").read_text()); assert p[\"passed\"] is False and p[\"error\"].startswith(\"SmokeError: DOM text:\") and not p[\"cleanup\"][\"remaining\"] and p[\"source_restored\"] is True; print(\"Wrong-text observer control failed for the expected reason; cleanup verified.\")"
          '
      - uses: actions/upload-artifact@v5
        with:
          name: LocalProjectHub-Linux
          path: release-assets/Local.Project.Hub.Ubuntu-24.04-amd64.deb
          if-no-files-found: error
      - name: Upload installed Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-runtime-smoke
          path: |
            ${{ runner.temp }}/linux-smoke
            ${{ runner.temp }}/openbox.log
          if-no-files-found: ignore

  publish:
    name: Publish to the GitHub release
    runs-on: ubuntu-24.04
    needs:
      # Tests AND every supported platform deliberately gate publication.
      - test
      - build-macos
      - build-windows
      - build-linux
    # TAGS ONLY — never add `|| github.event_name == 'workflow_dispatch'` here.
    # The build jobs above accept a manual dispatch so packaging can be tested
    # without cutting a release; this job is what actually creates the release
    # and attaches installers, so a manual run must not be able to do that.
    # tests/test_workflow_yaml.py asserts this stays true.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    # The workflow sets `contents: read` for everything, which is right for the
    # test and build jobs. Creating a release and attaching an asset needs write,
    # so it is granted here — to this job only, never workflow-wide. Without it
    # the token is read-only and GitHub answers
    # "HTTP 403: Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: LocalProjectHub-*
          merge-multiple: true
      - name: Create the release if it does not exist
        # `gh release upload` only attaches to a release that already exists —
        # nothing in this workflow ever created one, so the first tag that
        # reached this job died with "release not found" after successfully
        # downloading a 104 MB installer. The release is the thing users land
        # on, so it has to be created before anything is attached to it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = "false" ]; then
            echo "::error::refusing to replace published assets for $tag; use a new version"
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "$tag" --generate-notes --draft --prerelease=false --latest=false
          fi
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts/
          gh release upload "${GITHUB_REF#refs/tags/}" artifacts/* \
            --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Verify the complete draft before making it public
        # The in-app updater is fail-closed: it refuses to install an asset
        # whose release metadata carries no usable `sha256:` digest. GitHub
        # computes that digest when an asset is uploaded through the API, and
        # this step makes a release FAIL rather than publish installers the
        # app will then refuse to update from.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" > release.json
          python3 tools/release_artifacts.py verify --metadata release.json --version "${tag#v}" --repo "$GITHUB_REPOSITORY" --allow-draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" > published.json
          python3 tools/release_artifacts.py verify --metadata published.json --version "${tag#v}" --repo "$GITHUB_REPOSITORY"
