# TEMPORARY workbench on the fix branch only. Restore the ordinary CI workflow
# before final full verification. No release, build or publishing job is present.
name: TEMP Windows Qt compatibility observations
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    name: TEMP observations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare isolated baseline and current-stable Qt environments
        shell: pwsh
        run: |
          foreach ($version in @('6.7.3', '6.12.0')) {
            $target = Join-Path $env:RUNNER_TEMP ('lph-qt-' + $version)
            python -m venv $target
            if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
            $python = Join-Path $target 'Scripts/python.exe'
            & $python -m pip install --disable-pip-version-check "PySide6==$version" "PySide6-Essentials==$version" "PySide6-Addons==$version" 'Pillow==11.3.0' 'certifi==2026.10.18' pytest PyYAML
            if ($LASTEXITCODE -ne 0) { throw "dependency install failed for Qt $version" }
          }
      - name: TEMP collect default-sandbox renderer and exact Hub observations
        env:
          PROBE_IMAGE: ${{ matrix.os }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/windows_qt_compat_probe.py
      - name: Preserve actual observations and rendered images even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qt-compat-${{ matrix.os }}
          path: |
            qt-compat-report.json
            qt-compat-images/*.png
          if-no-files-found: error
          retention-days: 7
