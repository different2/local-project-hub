name: CI

# NB: this key must stay spelled "on" -- quoted, and never re-dumped through
# PyYAML, which follows YAML 1.1 where `on` is a boolean and rewrote it as
# `true:`. GitHub rejected the whole workflow with "Unexpected value 'true'",
# and the resulting 0-second runs were indistinguishable from runner refusal.
'on':
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The cap has to cover the real work, and that is dominated by one suite:
    # test_urldetect takes ~6 minutes because 9 of its tests create a real
    # QtWebEngine window and each is isolated into its own process (running the
    # file in a single process segfaults at Qt shutdown with zero tests
    # reported -- that is what the isolation is for, so it cannot simply be
    # dropped). 14 suites together land near 30 minutes on this Mac and more on
    # a CI runner, so a 35-minute cap killed the job before any output was
    # written, twice.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # max-parallel: 1 -- the suites bind fixed ports on 127.0.0.1, so two
      # platforms could not collide even if they shared a machine (they do not:
      # each matrix job gets its own runner). Serialising is about runner
      # ALLOCATION, not isolation: parallel GUI jobs contend for the account's
      # capacity, and a platform that needs a slot can sit queued behind one
      # that is only slow. One at a time gets the scarce runner to the platform
      # that needs it.
      max-parallel: 1
      matrix:
        # Pinned to 24.04: the ubuntu-latest label moves to Ubuntu 26, which
        # this project has not been tested against.
        #
        # Windows only for now, while its WinError 32 failures are being closed
        # out. The others are covered off-runner: the user develops on macOS and
        # runs the suite locally (verified under both Python 3.9 and 3.11, the
        # version CI uses), and Ubuntu has been green 14/14 with no changes
        # pending. Add an entry back here when that platform needs re-checking --
        # each one costs runner capacity the others are competing for.
        os:
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # QtWebEngineWidgets lives in the base PySide6 wheel, NOT in
          # PySide6-Addons/Essentials. Naming only the Addons/Essentials
          # packages installs a PySide6 that imports fine and then fails with
          # "No module named PySide6.QtWebEngineWidgets", which makes every GUI
          # suite exit non-zero with zero tests run.
          #
          # PyYAML is needed by tests/test_workflow_yaml.py, which guards this
          # very file. Without it that guard dies with ModuleNotFoundError on
          # every platform -- and this file is what broke silently once already,
          # so its guard has to be able to run everywhere.
          python -m pip install PySide6-Essentials PySide6-Addons PySide6 Pillow pytest PyYAML

      # Must come BEFORE the import check below: the check needs libEGL and
      # friends, so running it first reports a missing-OS-library problem as a
      # missing-wheel problem and sends you chasing the wrong cause.
      - name: Install Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install each package individually and tolerate a name that does not
          # exist in this image: one wrong name must not abort the whole job and
          # hide the real Qt error. The import guard below is the actual check.
          for p in \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-glx0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxext6 \
            libxfixes3 libxi6 libxrender1 libfontconfig1 libfreetype6 libgbm1 libasound2 libnss3 \
            libnspr4 libexpat1 ; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::$p unavailable in this image (continuing)"
          done
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Verify QtWebEngine is importable
        shell: bash
        run: |
          # QtWebEngineWidgets ships in the base PySide6 wheel. Assert it imports
          # so a resolution problem names itself here instead of surfacing later
          # as a bare "Run the test suite" failure with no output to read.
          python -c "import PySide6, os; d=os.path.dirname(PySide6.__file__); print('PySide6', PySide6.__version__, 'at', d)"
          python -m pip list | grep -i pyside || true
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print('QtWebEngine OK', __import__('PySide6').__version__)"

      - name: Run the test suite
        shell: bash
        run: |
          # Tee to a .log so the upload step below has something to publish even
          # when the suite fails. Without the tee a failing run uploaded an
          # empty artifact and the failure could not be read offline.
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/run_all.py 2>&1 | tee test-output.log
          else
            python tests/run_all.py 2>&1 | tee test-output.log
          fi
          # Preserve the suite's exit code through the pipe; tee would mask it
          # and report a red suite as green.
          exit "${PIPESTATUS[0]}"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-${{ runner.os }}
          path: '**/*.log'
          if-no-files-found: ignore
          retention-days: 7

  # macOS is NOT built here. CI is Windows-only on purpose: the maintainer
  # builds and tests macOS on his own machine, and a second full Briefcase
  # build per tag only duplicates that. The `[tool.briefcase.app.hub.macOS]`
  # config in pyproject.toml is untouched, so `briefcase build macOS` still
  # works locally — this job was removed rather than the build config.
  # If a macOS build is ever needed on CI again, it should NOT be added back to
  # `publish`'s needs list: `needs` makes every listed job a hard requirement,
  # so one failing platform build silently blocks the release for the other.

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip briefcase
          python -m pip install PySide6 PySide6-Addons PySide6-Essentials Pillow
      - name: Build the MSI installer
        # `--msi` was never a valid flag — this job is tag-gated and the repo had
        # no tags until v0.3.7, so the command had never once been executed and
        # the typo went unnoticed. The flag is -p/--packaging-format, which is
        # what both the runner's Briefcase and the local .buildenv (0.4.5) accept.
        run: briefcase package windows -p msi
      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.msi" -exec cp {} dist/ \;
          ls -la dist/
      - uses: actions/upload-artifact@v5
        with:
          name: LocalProjectHub-Windows
          path: dist/*.msi
          if-no-files-found: error

  publish:
    name: Publish to the GitHub release
    runs-on: ubuntu-24.04
    needs:
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release if it does not exist
        # `gh release upload` only attaches to a release that already exists —
        # nothing in this workflow ever created one, so the first tag that
        # reached this job died with "release not found" after successfully
        # downloading a 104 MB installer. The release is the thing users land
        # on, so it has to be created before anything is attached to it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" \
              --title "$tag" --generate-notes
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts/
          gh release upload "${GITHUB_REF#refs/tags/}" artifacts/* \
            --clobber --repo "${GITHUB_REPOSITORY}"
