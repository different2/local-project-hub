# TEMPORARY diagnostic replacement. Restore exact release workflow from464a95d
# before the next full acceptance run. No tag trigger or publication exists here.
name: CI
'on':
  workflow_dispatch:
    inputs:
      linux_only:
        description: TEMP actual Linux GUI diagnosis only; never publishes
        type: boolean
        required: false
        default: true
permissions:
  contents: read
jobs:
  diagnostic:
    name: TEMP actual Linux GUI comparison (NOT release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install identical pinned Qt and runtime
        run: |
          sudo apt-get update
          packages="$(python -c 'import tomllib; d=tomllib.load(open("pyproject.toml", "rb")); print(" ".join(d["tool"]["briefcase"]["app"]["hub"]["linux"]["system"]["ubuntu"]["noble"]["system_runtime_requires"]))')"
          sudo apt-get install -y --no-install-recommends $packages xvfb xauth dbus-daemon libgl1-mesa-dri fonts-dejavu-core
          python -m pip install "PySide6==6.7.3" "PySide6-Essentials==6.7.3" "PySide6-Addons==6.7.3" "Pillow==11.3.0" "certifi==2026.10.18"
      - name: Collect ACTUAL child exits without accepting failures
        run: xvfb-run -a python tools/_diagnose_linux_gui.py --output "$RUNNER_TEMP/linux-diagnostic"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: TEMP-linux-diagnostic
          path: ${{ runner.temp }}/linux-diagnostic
          if-no-files-found: error
