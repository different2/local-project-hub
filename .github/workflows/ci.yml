# TEMP: native installed-MSI acceptance only; never merge this workflow into main.
name: TEMP installed Windows MSI acceptance
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  msi-native:
    name: Install, render, close and uninstall exact MSI (Windows 2025)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source checkout line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 77aaa1877c3c586634f572ede63f9bf7095abb08
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify actual source build run before downloading
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api repos/different2/local-project-hub/actions/runs/40845715963 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.head_sha -ne '77aaa1877c3c586634f572ede63f9bf7095abb08' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Wrong or incomplete source build run' }
          @{ source_run_id=40845715963; source_sha=$run.head_sha; artifact='LocalProjectHub-Windows'; expected_msi_sha256='ae539e3596f391b5f7dd272b024610ad7b4abf2c5b4c601aaa743ffa894eea2d' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'msi-artifact-binding.json')
      - uses: actions/download-artifact@v5
        with:
          name: LocalProjectHub-Windows
          run-id: 40845715963
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lph-msi-artifact
      - name: Verify exact downloaded MSI bytes
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'lph-msi-artifact/Local.Project.Hub.msi'
          if ((Get-Item $msi).Length -ne 108763314 -or (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne 'ae539e3596f391b5f7dd272b024610ad7b4abf2c5b4c601aaa743ffa894eea2d') { throw 'Downloaded MSI is not the accepted build artifact' }
      - name: Prepare isolated observer only
        run: |
          python -m venv (Join-Path $env:RUNNER_TEMP 'lph-msi-observer')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:RUNNER_TEMP 'lph-msi-observer/Scripts/python.exe') -m pip install psutil==7.0.0 websocket-client==1.8.0 Pillow==11.3.0
          exit $LASTEXITCODE
      - name: Calibrate pure helper and blank-image rejection
        run: |
          $py = Join-Path $env:RUNNER_TEMP 'lph-msi-observer/Scripts/python.exe'
          & $py -B qa/tools/test_smoke_windows_msi.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -B qa/tools/temp_capture_windows_msi.py --self-test
          exit $LASTEXITCODE
      - name: Exercise actual installed MSI with native pixels and normal exit
        run: |
          $py = Join-Path $env:RUNNER_TEMP 'lph-msi-observer/Scripts/python.exe'
          & $py -B qa/tools/temp_capture_windows_msi.py --msi (Join-Path $env:RUNNER_TEMP 'lph-msi-artifact/Local.Project.Hub.msi') --output (Join-Path $env:RUNNER_TEMP 'lph-msi-native-positive') --expected-version 0.7.4 --source-sha 77aaa1877c3c586634f572ede63f9bf7095abb08 --source-root (Join-Path $env:GITHUB_WORKSPACE 'source')
          exit $LASTEXITCODE
      - name: Upload only owned acceptance evidence, never browser profiles
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-msi-native-77aaa18-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/msi-artifact-binding.json
            ${{ runner.temp }}/lph-msi-native-positive/report.json
            ${{ runner.temp }}/lph-msi-native-positive/install.log
            ${{ runner.temp }}/lph-msi-native-positive/uninstall.log
            ${{ runner.temp }}/lph-msi-native-positive/app.log
            ${{ runner.temp }}/lph-msi-native-positive/webview.png
            ${{ runner.temp }}/lph-msi-native-positive/native-window.png
            ${{ runner.temp }}/lph-msi-native-positive/native-capture.json
          if-no-files-found: error
          retention-days: 7
