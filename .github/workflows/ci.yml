# CI: run tests, then build installers for both platforms.
#
# Why this exists: Briefcase can only build for the OS it runs on, so the
# Windows installer cannot be produced on a Mac. GitHub gives every public
# repo free macOS and Windows runners, so a tagged release builds both
# artifacts and attaches them to the release — no Windows machine needed.
#
# Publishing is deliberately manual: the build job runs on tags only, and
# uploading to the release is gated behind a protected `release` environment
# so a stray push cannot publish.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # QtWebEngineWidgets lives in the base PySide6 wheel, NOT in
          # PySide6-Addons/Essentials. Naming only the Addons/Essentials
          # packages installs a PySide6 that imports fine and then fails with
          # "No module named PySide6.QtWebEngineWidgets", which makes every GUI
          # suite exit non-zero with zero tests run.
          python -m pip install PySide6-Essentials PySide6-Addons PySide6 Pillow pytest

      # QtWebEngineWidgets ships in the base PySide6 wheel. Assert it imports so
      # a resolution problem here names itself instead of surfacing later as a
      # bare "Run the test suite" failure with no test output to read.
      - name: Verify QtWebEngine is importable
        shell: bash
        run: |
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print('QtWebEngine OK', __import__('PySide6').__version__)"

      # The GUI suites need a display; xvfb provides one on Linux.
      - name: Install xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the test suite
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/run_all.py
          else
            python tests/run_all.py
          fi

      # Always upload the log, pass or fail: without it a red job gives no
      # evidence of what actually broke.
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ runner.os }}
          path: |
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  build-macos:
    name: Build macOS installer
    # Only on tags: a normal push should not produce release artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip briefcase
          python -m pip install PySide6 PySide6-Addons PySide6-Essentials Pillow

      - name: Build the .app
        run: briefcase build macOS

      - name: Package the .dmg
        run: briefcase package macOS --dmg

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.dmg" -exec cp {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: LocalProjectHub-macOS
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Briefcase and dependencies
        run: |
          python -m pip install --upgrade pip briefcase
          python -m pip install PySide6 PySide6-Addons PySide6-Essentials Pillow

      - name: Build the MSI installer
        run: briefcase package windows --msi

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.msi" -exec cp {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: LocalProjectHub-Windows
          path: dist/*.msi
          if-no-files-found: error

  # Attach the built installers to the GitHub release so the in-app updater
  # can find them. Requires the `release` environment to be configured with
  # a protected deployment, which is what keeps publishing deliberate.
  publish:
    name: Publish to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts/
          gh release upload "${GITHUB_REF#refs/tags/}" artifacts/* \
            --clobber --repo "${GITHUB_REPOSITORY}"
