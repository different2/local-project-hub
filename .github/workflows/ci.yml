# TEMP diagnostic only: never merge into main; no build/publication/install.
name: TEMP Linux Qt input calibration
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-probe:
    if: github.repository == 'different2/local-project-hub' && github.event.repository.private == false && github.ref == 'refs/heads/diagnose/linux-input'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.15', '3.12.16']
    steps:
      - uses: actions/checkout@v5
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 052033e46ed014482b3ecf7c0fee337beb9b91cd
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact Qt and complete declared native dependencies
        run: |
          sudo apt-get update
          packages=$(python -c "import tomllib; c=tomllib.load(open('source/pyproject.toml','rb')); print(' '.join(c['tool']['briefcase']['app']['hub']['linux']['system']['ubuntu']['noble']['system_runtime_requires']))")
          sudo apt-get install -y --no-install-recommends $packages xvfb xauth
          python -m pip install PySide6==6.7.3 certifi==2026.10.18
      - name: Collect unchanged case evidence under both display backends
        run: |
          QT_QPA_PLATFORM=offscreen python -B qa/tools/temp_linux_input_probe.py --source source --output "$RUNNER_TEMP/input-offscreen"
          xvfb-run -a env QT_QPA_PLATFORM=xcb python -B qa/tools/temp_linux_input_probe.py --source source --output "$RUNNER_TEMP/input-xcb"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-input-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/input-offscreen/
            ${{ runner.temp }}/input-xcb/
          if-no-files-found: error
          retention-days: 7
