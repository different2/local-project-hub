name: CI
true:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - windows-latest
        - ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        # QtWebEngineWidgets lives in the base PySide6 wheel, NOT in

        # PySide6-Addons/Essentials. Naming only the Addons/Essentials

        # packages installs a PySide6 that imports fine and then fails with

        # "No module named PySide6.QtWebEngineWidgets", which makes every GUI

        # suite exit non-zero with zero tests run.

        python -m pip install PySide6-Essentials PySide6-Addons PySide6 Pillow pytest

        '
    - name: Install Qt runtime libraries (Linux only)
      if: runner.os == 'Linux'
      run: "sudo apt-get update\n# Install each package individually and tolerate a name that does not\n\
        # exist in this image: one wrong name must not abort the whole job and\n# hide the real Qt error.\
        \ The import guard below is the actual check.\nfor p in \\\n  libegl1 libgl1 libglib2.0-0 libdbus-1-3\
        \ \\\n  libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 \\\n  libxcb-cursor0 libxcb-glx0\
        \ libxcb-icccm4 libxcb-image0 \\\n  libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0\
        \ \\\n  libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \\\n  libxcb-xfixes0 libxcb-xkb1 libxext6\
        \ libxfixes3 libxi6 libxrender1 \\\n  libfontconfig1 libfreetype6 libgbm1 libasound2 \\\n  libnss3\
        \ libnspr4 libexpat1 ; do\n  sudo apt-get install -y --no-install-recommends \"$p\" \\\n    ||\
        \ echo \"::warning::$p unavailable in this image (continuing)\"\ndone\nsudo apt-get install -y\
        \ --no-install-recommends xvfb\n"
    - name: Verify QtWebEngine is importable
      shell: bash
      run: 'python -c "import PySide6, os; d=os.path.dirname(PySide6.__file__); print(''PySide6'', PySide6.__version__,
        ''at'', d)"

        python -m pip list | grep -i pyside || true

        python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print(''QtWebEngine OK'', __import__(''PySide6'').__version__)"

        '
    - name: Run the test suite
      shell: bash
      run: "if [ \"$RUNNER_OS\" = \"Linux\" ]; then\n  xvfb-run -a python tests/run_all.py\nelse\n  python\
        \ tests/run_all.py\nfi\n"
    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-log-${{ runner.os }}
        path: '**/*.log

          '
        if-no-files-found: ignore
        retention-days: 7
  build-macos:
    name: Build macOS installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install Briefcase and dependencies
      run: 'python -m pip install --upgrade pip briefcase

        python -m pip install PySide6 PySide6-Addons PySide6-Essentials Pillow

        '
    - name: Build the .app
      run: briefcase build macOS
    - name: Package the .dmg
      run: briefcase package macOS --dmg
    - name: Collect the installer
      shell: bash
      run: 'mkdir -p dist

        find build -name "*.dmg" -exec cp {} dist/ \;

        ls -la dist/

        '
    - uses: actions/upload-artifact@v5
      with:
        name: LocalProjectHub-macOS
        path: dist/*.dmg
        if-no-files-found: error
  build-windows:
    name: Build Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install Briefcase and dependencies
      run: 'python -m pip install --upgrade pip briefcase

        python -m pip install PySide6 PySide6-Addons PySide6-Essentials Pillow

        '
    - name: Build the MSI installer
      run: briefcase package windows --msi
    - name: Collect the installer
      shell: bash
      run: 'mkdir -p dist

        find build -name "*.msi" -exec cp {} dist/ \;

        ls -la dist/

        '
    - uses: actions/upload-artifact@v5
      with:
        name: LocalProjectHub-Windows
        path: dist/*.msi
        if-no-files-found: error
  publish:
    name: Publish to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - build-macos
    - build-windows
    runs-on: ubuntu-24.04
    environment: release
    steps:
    - uses: actions/download-artifact@v5
      with:
        path: artifacts
        merge-multiple: true
    - name: Upload installers to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "ls -la artifacts/\ngh release upload \"${GITHUB_REF#refs/tags/}\" artifacts/* \\\n  --clobber\
        \ --repo \"${GITHUB_REPOSITORY}\"\n"
