name: TEMP Windows renderer diagnostic

# TEMPORARY investigation only. Remove this workflow and its script before merge.
# It does not replace the ordinary CI check and cannot publish a release.
'on':
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-renderer-probe.yml
      - tools/windows_renderer_probe.py

permissions:
  contents: read

jobs:
  renderer-probe:
    name: TEMP compare bare Qt and Hub rendering
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the same dependencies as product CI
        run: python -m pip install "PySide6==6.7.3" "Pillow==11.3.0" "certifi==2026.10.18" PyYAML pytest
      - name: Compare one setting at a time without changing the app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONUNBUFFERED: '1'
        run: python tools/windows_renderer_probe.py
      - name: Preserve diagnostic results, including failed children
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TEMP-windows-renderer-probe
          path: renderer-probe.json
          if-no-files-found: warn
          retention-days: 7
